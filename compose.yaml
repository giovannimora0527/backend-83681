services:
  db:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Define DB_NAME en .env}
      MYSQL_USER: ${DB_USER:?Define DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${DB_NAME}?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Genera y define JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4300}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      OTP_CONSOLE_MODE: ${OTP_CONSOLE_MODE:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      CLINICA_FACTURACION_NOMBRE: "${CLINICA_FACTURACION_NOMBRE:-Clínica Veterinaria Uniminuto}"
      CLINICA_FACTURACION_NIT: "${CLINICA_FACTURACION_NIT:-DEMO-NIT-NO-VALIDO}"
      CLINICA_FACTURACION_DIRECCION: "${CLINICA_FACTURACION_DIRECCION:-Dirección ficticia para demostración}"
      CLINICA_FACTURACION_TELEFONO: "${CLINICA_FACTURACION_TELEFONO:-000 000 0000}"
      CLINICA_FACTURACION_CORREO: "${CLINICA_FACTURACION_CORREO:-demo@clinica.invalid}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-lc", "</dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 600s

  frontend:
    build:
      context: ../frontend26-83681
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
