services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${DB_NAME:?Define DB_NAME en .env}?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?Define DB_USER en .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Genera y define JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      OTP_CONSOLE_MODE: ${OTP_CONSOLE_MODE:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-lc", "</dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 600s

  # Frontend Angular servido por Nginx en su propio contenedor.
  # Nginx reenvía /clinica/v1/ al contenedor "app" por la red interna de Docker (ver nginx.conf),
  # así el navegador solo habla con http://localhost:4200 y no hay problemas de CORS.
  frontend:
    build:
      context: ../frontend26-83681
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      app:
        condition: service_healthy
