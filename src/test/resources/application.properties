# Configuración usada solo por las pruebas (reemplaza a src/main/resources/application.properties).
# Usa una base H2 en memoria en modo MySQL para no depender de un servidor MySQL.
spring.application.name=clinica
server.servlet.context-path=/clinica/v1
spring.datasource.url=jdbc:h2:mem:clinica;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
