spring.application.name=clinica

server.port=8080
server.tomcat.threads.max=32
server.servlet.contextPath=/clinica/v1

#Conexion BD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Solo para MySQL local en desarrollo; en produccion usa TLS y no habilites esta opcion.
spring.datasource.url=jdbc:mysql://localhost:3306/clinica?zeroDateTimeBehavior=convertToNull&serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Incluye errores dentro de las respuestas http
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false