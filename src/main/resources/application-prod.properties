spring.application.name=clinica

server.port=8080
server.tomcat.max-threads=32
server.servlet.contextPath=/clinica/v1

#Conexion BD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica?serverTimezone=America/Bogota&useSSL=false}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
