spring.application.name=clinica
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:./application-secrets.properties

server.port=8080
server.tomcat.max-threads=32
server.servlet.contextPath=/clinica/v1

# ---- Base de datos (variables de entorno; los valores por defecto sirven para desarrollo local) ----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.time-zone=America/Bogota

# ---- Correo SMTP (la contraseña NO se guarda en el repositorio) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.to=${MAIL_TO:}

# ---- Seguridad ----
# Clave HS512 en Base64. En producción defínala con la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
# Si se define, el código OTP es fijo y no se envía correo (solo para demostración/pruebas).
app.otp.fixed-code=${OTP_FIXED_CODE:}

# ---- Inventario y cargas ----
app.inventario.dias-por-vencer=${DIAS_POR_VENCER:60}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---- Documentación OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
